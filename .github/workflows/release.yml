# Builds RifeGapfill-<version>.exe and publishes a GitHub release.
#
# Start it either way:
#   - Actions > Release > Run workflow, enter a version such as v2.2
#     (leave it empty for a test build that is only kept as an artifact)
#   - git tag v2.2 && git push origin v2.2
#
# 1. test:    renders the synthetic test clips and checks detection (Linux)
# 2. build:   PyInstaller one-file exe (Windows)
# 3. release: creates the tag and the release, notes from
#             docs/releases/<version>.md, exe attached, SHA-256 appended

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v2.2 (empty = test build only)"
        required: false
        default: ""

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg and Python packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install numpy pillow opencv-python-headless
      - name: Render test clips
        working-directory: tests
        run: python make_tests.py clips
      - name: Check detection
        working-directory: tests
        run: python evaluate.py --check clean random periodic

  build:
    needs: test
    runs-on: windows-latest
    outputs:
      name: ${{ steps.build.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: pip install pyinstaller numpy pillow opencv-python-headless
      - name: Build exe
        id: build
        shell: pwsh
        run: |
          $tag = if ("$env:VERSION") { "$env:VERSION" } else { "dev-${{ github.run_number }}" }
          if ($tag -notmatch '^(v\d+(\.\d+)*|dev-\d+)$') { throw "version must look like v2.2, got '$tag'" }
          $name = "RifeGapfill-$tag"
          pyinstaller --onefile --windowed --name $name gapfill_gui.py
          if (-not (Test-Path "dist/$name.exe")) { throw "build failed: dist/$name.exe missing" }
          $hash = (Get-FileHash "dist/$name.exe" -Algorithm SHA256).Hash.ToLower()
          $notes = "docs/releases/$tag.md"
          $body = if (Test-Path $notes) { Get-Content $notes -Raw } else { "" }
          $body = $body.TrimEnd() + "`n`nSHA-256 of ``$name.exe``: ``$hash``"
          Set-Content -Path release-notes.md -Value $body -Encoding utf8
          "name=$name" >> $env:GITHUB_OUTPUT
          Write-Host "$name.exe  $hash"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: |
            dist/${{ steps.build.outputs.name }}.exe
            release-notes.md

  release:
    needs: build
    if: github.ref_type == 'tag' || inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.name }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: RIFE Gapfill ${{ env.VERSION }}
          body_path: release-notes.md
          files: dist/${{ needs.build.outputs.name }}.exe
          make_latest: true
